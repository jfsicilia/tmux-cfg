# == Prefix binding  ========================================================

unbind C-b             # Unbind default prefix (Ctrl+b)
set -g prefix M-b      # Set Alt+b as prefix (M-b)
bind M-b send-prefix   # 2xAlt+b sends Alt+b

# == General Keybindings ====================================================

# -- Session lifecycle: sleep / kill / awake / revive ----------------------
#
# scripts/hibernate-lib.sh + friends. "sleep" parks a session, "kill" closes it:
# both save it via tmux-persist, move its "<name>_*" snapshot into a subdir
# (persist/sleeping/ or persist/killed/) and then kill the session. So a parked 
# or killed session stays gone from the server — and the status list — until
# `awake`/`revive` moves it back and restores it.
bind S switch-client -T sessmgr

# new session (prompts for the name; opens in the current pane's dir)
bind -T sessmgr n command-prompt -p "new session:" "new-session -s '%%' -c '#{pane_current_path}'"
# toggle session
bind -T sessmgr t run-shell -b "sesh last"
# detach client
bind -T sessmgr d detach-client
# save all sessions
bind -T sessmgr s run-shell -b "'#{@persist-save-script-path}' quiet all"
# save current session
bind -T sessmgr S run-shell -b "'#{@persist-save-script-path}' quiet '#{client_session}'"
# save all sessions and detach
bind -T sessmgr w run-shell "'#{@persist-save-script-path}' quiet all >/dev/null 2>&1; tmux detach-client"
# save current session and detach
bind -T sessmgr W run-shell "'#{@persist-save-script-path}' quiet '#{client_session}' >/dev/null 2>&1; tmux detach-client"
# sleep current session
bind -T sessmgr z confirm-before -p "sleep session '#S'? (y/n)" { run-shell -b "~/.config/tmux/scripts/sleep.sh '#{client_session}'" }
# awake a session from the sleeping list
bind -T sessmgr Z display-popup -w 60% -h 50% -E "~/.config/tmux/scripts/awake.sh"
# kill current session
bind -T sessmgr k confirm-before -p "kill session '#S'? (y/n)" { run-shell -b "~/.config/tmux/scripts/kill.sh '#{client_session}'" }
# revive a session from the killed list
bind -T sessmgr K display-popup -w 60% -h 50% -E "~/.config/tmux/scripts/revive.sh"

# List sessions.
bind -T sessmgr Space run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..}; sesh cache refresh)+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# Focus session by index.
bind -T sessmgr 1 run-shell -b "tmux switch-client -t \"$(tmux ls | LC_ALL=C sort | sed -n 1p | cut -d: -f1)\""
bind -T sessmgr 2 run-shell -b "tmux switch-client -t \"$(tmux ls | LC_ALL=C sort | sed -n 2p | cut -d: -f1)\""
bind -T sessmgr 3 run-shell -b "tmux switch-client -t \"$(tmux ls | LC_ALL=C sort | sed -n 3p | cut -d: -f1)\""
bind -T sessmgr 4 run-shell -b "tmux switch-client -t \"$(tmux ls | LC_ALL=C sort | sed -n 4p | cut -d: -f1)\""
bind -T sessmgr 5 run-shell -b "tmux switch-client -t \"$(tmux ls | LC_ALL=C sort | sed -n 5p | cut -d: -f1)\""
bind -T sessmgr 6 run-shell -b "tmux switch-client -t \"$(tmux ls | LC_ALL=C sort | sed -n 6p | cut -d: -f1)\""
bind -T sessmgr 7 run-shell -b "tmux switch-client -t \"$(tmux ls | LC_ALL=C sort | sed -n 7p | cut -d: -f1)\""
bind -T sessmgr 8 run-shell -b "tmux switch-client -t \"$(tmux ls | LC_ALL=C sort | sed -n 8p | cut -d: -f1)\""
bind -T sessmgr 9 run-shell -b "tmux switch-client -t \"$(tmux ls | LC_ALL=C sort | sed -n 9p | cut -d: -f1)\""

bind M-w run-shell -b "workmux sidebar off"

# -- workmux worktrees ----------------------------------------------------
# 
# Each acts on the worktree of the current pane's directory, in a popup opened
# at that path. Ported from the old kanata `worktree` macros.
#
# The `TMUX_PANE=$(tmux display-message -p '#{pane_id}')` prefix is required: a
# popup's shell doesn't inherit TMUX_PANE, and without it `workmux` can't tell
# which tmux session to place/find the worktree window in when several sessions
# are open. From inside a popup `#{pane_id}` resolves to the client's active
# pane. (display-popup does NOT format-expand -E, so the `$(...)` runs in the
# popup shell.)
bind W switch-client -T worktree

# new worktree — prompts for the branch name
bind -T worktree n command-prompt -p "workmux add branch:" "display-popup -w 80% -h 80% -d '#{pane_current_path}' -E \"TMUX_PANE=\$(tmux display-message -p '#{pane_id}') workmux add %%\""
# rename this worktree — prompts for the new name
bind -T worktree r command-prompt -p "rename worktree to:" "display-popup -w 80% -h 80% -d '#{pane_current_path}' -E \"TMUX_PANE=\$(tmux display-message -p '#{pane_id}') workmux rename %%\""
# merge this worktree (then cleans up), with confirm
bind -T worktree m confirm-before -p "merge worktree #{b:pane_current_path}? (y/n)"  { display-popup -w 80% -h 80% -d "#{pane_current_path}" -E "TMUX_PANE=$(tmux display-message -p '#{pane_id}') workmux merge" }
# remove this worktree (no merge), with confirm
bind -T worktree k confirm-before -p "remove worktree #{b:pane_current_path}? (y/n)" { display-popup -w 80% -h 80% -d "#{pane_current_path}" -E "TMUX_PANE=$(tmux display-message -p '#{pane_id}') workmux remove" }
# rebase this worktree onto its base branch, with confirm
bind -T worktree b confirm-before -p "rebase worktree #{b:pane_current_path}? (y/n)" { display-popup -w 80% -h 80% -d "#{pane_current_path}" -E "TMUX_PANE=$(tmux display-message -p '#{pane_id}') workmux rebase" }
# close this worktree's tmux window (keeps worktree + branch)
bind -T worktree w display-popup -w 80% -h 80% -d "#{pane_current_path}" -E "TMUX_PANE=$(tmux display-message -p '#{pane_id}') workmux close"
# worktree picker (all projects) — its own 1-9 quick-jump works inside, across projects
bind -T worktree Space display-popup -w 90% -h 90% -d "#{pane_current_path}" -E "TMUX_PANE=$(tmux display-message -p '#{pane_id}') workmux dashboard -t worktrees"

# -- workmux agents ------------------------------------------------------
# Move between running agents. Ported from the old kanata `agents` macros. Same
# TMUX_PANE dance as the worktree binds — workmux needs it to know which client
# to switch (run-shell expands #{pane_id}; the popup shell runs the $(...)).
bind A switch-client -T agent

# agent dashboard (all sessions) — its own 1-9 quick-jump works inside
bind -T agent Space display-popup -w 90% -h 90% -d "#{pane_current_path}" -E "TMUX_PANE=$(tmux display-message -p '#{pane_id}') workmux dashboard -t agents"
# next / prev agent in sidebar order
bind -T agent l run-shell -b "TMUX_PANE=#{pane_id} workmux sidebar next"
bind -T agent h run-shell -b "TMUX_PANE=#{pane_id} workmux sidebar prev"
# jump to the agent that most recently finished / is waiting for input
bind -T agent d run-shell -b "TMUX_PANE=#{pane_id} workmux last-done"
# toggle between the last two agents visited
bind -T agent a run-shell -b "TMUX_PANE=#{pane_id} workmux last-agent"

# Avoid nvim problem waiting at Esc.
set -sg escape-time 0

# Set the default terminal inside tmux
set -g default-terminal "tmux-256color"

# Tell tmux that the outside terminal (foot) supports True Color and sixel graphics
set -as terminal-features ",foot:RGB:sixel"

set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Enable undercurl support
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setrgb=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%&%d::%p1%{255}%/%&%dm'

# Set titles on terminal window dynamically.
set -g set-titles on
set -g set-titles-string "tmux (#S:#W:#{pane_current_command}) - #T"

# Rename base on current command.
setw -g automatic-rename off
set -g allow-rename off

# Stay in tmux when session closes
set -g detach-on-destroy off     

# Start numbering at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# == Panes Settings ==========================================================
set-window-option -g window-style 'bg=#1e1e2e'
set-window-option -g window-active-style 'bg=#252535'

set -g pane-border-lines single 
set -g pane-border-status top             # Full-width title bar per pane
set -g pane-border-format ' #{pane_index} #{pane_current_command} '

# == Status Bar Settings & Catppuccin plugin. ===============================
set -g status-position top  # Move the status bar to the top of the screen

set -g status 2        # two status lines: line 0 (top) = session list,
                       #                   line 1 = the bar
set -g message-line 0  # messages / `:` command-prompt take over the top line
                       # (so the session list is what disappears while typing)

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# -- Windows pills. ----------------------------------------------------------

# NOTE: #{@workmux_status} is a per-window user option set by `workmux set-window-status`
# (agent icon: working/waiting/done). Embedding it here — with workmux's own
# format rewriting disabled via `status_format: false` in ~/.config/workmux/
# config.yaml — keeps the icon inside the rounded window pill instead of hanging
# off the end as a bare rectangle.
set -g @catppuccin_window_text " #W#{?@workmux_status, #{@workmux_status},}#{?window_zoomed_flag, 🔍,}"
set -g @catppuccin_window_current_text " #W#{?@workmux_status, #{@workmux_status},}#{?window_zoomed_flag, 🔍,}"
set -g @catppuccin_pane_active_border_style "fg=green"

# -- Session pill. -----------------------------------------------------------
set -g @catppuccin_session_text " [#S] "
set -g @catppuccin_status_session_text_bg "#a6e3a1"
set -g @catppuccin_status_session_text_fg "#11111b"
# `connect_separator no` makes catppuccin reset the bg to `default` around a
# module's separators. 
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_right_separator ""

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# The `@catppuccin_status_*` module strings only exist after `run`, so build
# the status line here. Session pill on the left (before the window pills),
# clock + date on the right.
set -g status-left "#{E:@catppuccin_status_session} "
set -g status-left-length 100


# -- Time+Date pill. ---------------------------------------------------------
set -g status-right "#[fg=#74c7ec,bg=default]#[fg=#11111b,bg=#74c7ec]󰃰 %H:%M · %Y-%m-%d #[fg=#74c7ec,bg=default]"
set -g status-right-length 100

# -- List of "open" sessions with current highlighted ------------------------

# tmux draws status-format[0] above status-format[1]. We want the bar (windows
# + session pill + clock) on the *lower* line, so it goes into [1], and the
# session list — centred plain text, only the active name coloured (blue+bold),
# the rest muted grey, no pills — goes into [0].
#
# The status-format[1] is a copy from `tmux -f /dev/null show-options -gv
# 'status-format[0]'` when there was only one line of status. 
#
# @thm_* / @_ctp_status_bg only exist after `run` of catppuccin config, so 
# this block stays below it.
set -gF @_sess_active   "#[fg=#{@thm_green},bold]"
set -gF @_sess_inactive "#[fg=#{@thm_overlay_1}]"
set -g status-format[0] "#[align=centre,fill=#{@_ctp_status_bg}]#[list=on]#[list=left-marker]<#[list=right-marker]>#[list=on]#{S/n:#[range=session|#{session_id}]#{@_sess_inactive} #{@sess_idx}.#{session_name} #[norange default],#[range=session|#{session_id} list=focus]#{@_sess_active} #{@sess_idx}.#{session_name} #[norange default nobold]}"
set -g status-format[1] "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"

# -- Command prompt / messages -----------------------------------------------
set -gF message-style         "align=left,bold,fill=#{@thm_peach},fg=#{@thm_crust},bg=#{@thm_peach}"
set -gF message-command-style "align=left,bold,fill=#{@thm_red},fg=#{@thm_crust},bg=#{@thm_red}"

# == Vim-Tmux Navigator plugin ==============================================

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind -n 'M-h' if-shell "$is_vim" 'send-keys M-h' 'select-pane -L'
bind -n 'M-j' if-shell "$is_vim" 'send-keys M-j' 'select-pane -D'
bind -n 'M-k' if-shell "$is_vim" 'send-keys M-k' 'select-pane -U'
bind -n 'M-l' if-shell "$is_vim" 'send-keys M-l' 'select-pane -R'

bind -T copy-mode-vi 'M-h' select-pane -L
bind -T copy-mode-vi 'M-j' select-pane -D
bind -T copy-mode-vi 'M-k' select-pane -U
bind -T copy-mode-vi 'M-l' select-pane -R

# == Tmux Resurrect & Continuum Plugins =====================================
# set -g @persist-dir '~/.tmux/persist"
# Restore Neovim sessions using your custom hidden file
set -g @persist-processes '"nvim->nvim -S .session.vim"'
# set -g @persist-strategy-vim 'session'
# set -g @persist-strategy-nvim 'session'

set -g @persist-save 'M-s'
set -g @persist-restore 'M-r'

# Do NOT capture/replay pane contents. Default is 'on', but on restore each pane
# runs `cat '<saved screen>'; exec zsh`, and:
#   - the dumped screen ends mid-line -> zsh's PROMPT_EOL_MARK shows a stray `%`;
#   - the old prompt text is replayed as frozen text above the live prompt;
#   - for a full-screen TUI (claude, nvim) the replayed escape sequences (incl.
#     cursor/DA queries the terminal answers) land in the shell's input buffer
#     ahead of the `send-keys "<cmd>"` that restores the process, corrupting it
#     -> the agent/editor never comes back, you're left at a shell.
# With this off, restored panes are clean shells and the process send-keys lands
# cleanly. Cost: no scrollback history in restored panes.
set -g @persist-capture-pane-contents 'off'

set -g @persist-save-on-exit 'off'
set -g @persist-auto-restore 'off'

set -g @persist-max-snapshots '5'

# set -g @resurrect-processes '"nvim->nvim -S .session.vim"'
# set -g @resurrect-strategy-nvim 'session'
# set -g @resurrect-save 'M-s'
# set -g @resurrect-restore 'M-r'
# set -g @resurrect-capture-pane-contents 'on'

# Enable automatic restore when tmux server starts
set -g @continuum-restore 'on'

# How often to save (in minutes). Default is 15.
set -g @continuum-save-interval '15'


# Load plugins manually
# run ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux
run ~/.config/tmux/plugins/tmux-persist/persist.tmux
run ~/.config/tmux/plugins/tmux-continuum/continuum.tmux

# == Session index ==========================================================

# Stamp @sess_idx on every session now (the hooks keep it current after).
run-shell -b "~/.config/tmux/scripts/reindex-sessions.sh"

# == Hooks ===================================================================

# Re-stamp @sess_idx on every session (its position in the name-sorted list) so
# the index shown in status-format[0] stays correct — see scripts/reindex-sessions.sh
# and the `#{@sess_idx}` refs in status-format[0]. Kept as its own hook entry,
# NOT chained after `sesh cache refresh`: that call takes several seconds here
# and `;` would make the reindex wait for it.
set-hook -g  session-created      'run-shell -b "~/.config/tmux/scripts/reindex-sessions.sh"'
set-hook -g  session-closed       'run-shell -b "~/.config/tmux/scripts/reindex-sessions.sh"'
set-hook -g  after-rename-session 'run-shell -b "~/.config/tmux/scripts/reindex-sessions.sh"'

# Keep sesh's cache in sync with tmux sessions (separate, so its slowness never
# holds up the reindex above).
set-hook -ga session-created     'run-shell -b "sesh cache refresh"'
set-hook -ga session-closed      'run-shell -b "sesh cache refresh"'

# workmux enables its sidebar with after-new-session[99] + after-new-window[99]
# hooks that each run `workmux _sidebar-sync`. On a `new-session` BOTH fire for
# the first window and, being `run-shell -b`, race — each splits in a sidebar
# pane, so the session ends up with two. `_sidebar-sync` alone is idempotent;
# only the concurrency is the bug (present on any plain `new-session` —
# `sesh connect`, `workmux add`, `tmux new`, the sessmgr `n` binding …). workmux
# builds the sidebar with a split, so reap the duplicate from after-split-window.
# Fixed index so a config reload replaces it rather than stacking copies; well
# clear of workmux's own hook indices (98/99).
set-hook -g 'after-split-window[50]' 'run-shell -b "~/.config/tmux/scripts/wm-sidebar-dedup.sh #{window_id}"'

