# Unbind default prefix (Ctrl+b)
unbind C-b

# Set Alt+j as prefix
set-option -g prefix M-b
bind-key M-b send-prefix

# Avoid nvim problem waiting at Esc.
set -s escape-time 0

# Set the default terminal inside tmux
set -g default-terminal "tmux-256color"

# Tell tmux that the outside terminal (foot) supports True Color
# The 'RGB' flag is the modern way to enable 24-bit color
set -as terminal-features ",foot:RGB"

# Enable undercurl support (useful for LSP diagnostics in Neovim)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
# Enable undercurl colors
set -as terminal-overrides ',*:Setrgb=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%&%d::%p1%{255}%/%&%dm'

# Set titles on terminal window dynamically.
set -g set-titles on
set -g set-titles-string "tmux (#S:#P) - #T"

# Rename base on current command.
setw -g automatic-rename off
# set -g automatic-rename-format "#{pane_current_command}"
set -g allow-rename off

# Move the status bar to the top of the screen
set -g status-position top

# Start window numbering at 1 instead of 0 for easier keyboard navigation
set -g base-index 1

# Start pane numbering at 1 to match window numbering
setw -g pane-base-index 1

# Automatically renumber windows when one is closed to keep the list gapless
set -g renumber-windows on

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W#{?window_zoomed_flag, 🔍,}"
set -g @catppuccin_window_current_text " #W#{?window_zoomed_flag, 🔍,}"
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Floax - floating pane toggle
set -g @floax-bind 'p'
run ~/.config/tmux/plugins/floax/floax.tmux

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator

# decide whether we're in a Vim process
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'M-h' if-shell "$is_vim" 'send-keys M-h' 'select-pane -L'
bind-key -n 'M-j' if-shell "$is_vim" 'send-keys M-j' 'select-pane -D'
bind-key -n 'M-k' if-shell "$is_vim" 'send-keys M-k' 'select-pane -U'
bind-key -n 'M-l' if-shell "$is_vim" 'send-keys M-l' 'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'

if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

# bind-key -n 'C-Space' if-shell "$is_vim" 'send-keys C-Space' 'select-pane -t:.+'

bind-key -T copy-mode-vi 'M-h' select-pane -L
bind-key -T copy-mode-vi 'M-j' select-pane -D
bind-key -T copy-mode-vi 'M-k' select-pane -U
bind-key -T copy-mode-vi 'M-l' select-pane -R
bind-key -T copy-mode-vi 'M-\' select-pane -l
# bind-key -T copy-mode-vi 'M-Space' select-pane -t:.+
